<title>今天吃点什么？ · 甜甜抽奖屋</title>
<style>

s:24px;min-width:0;min-height:245px;background:linear-gradient(145deg,#fff0f4,#f9e5ee);color:var(--ink);padding:15px 10px 14px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;transition:transform .24s,box-shadow .24s,border .24s}.draw-card:nth-child(2){background:linear-gradient(145deg,#f3edff,#e9dff9);border-color:#e4d9f3}.draw-card:nth-child(3){background:linear-gradient(145deg,#fff3dd,#fae7d2);border-color:#f3dfc6}.draw-card:not(:disabled):hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 12px 20px #b47f9c28}.draw-card:not(:disabled):active{transform:scale(.98)}.draw-card:disabled{cursor:default}.draw-card:before{content:"";position:absolute;inset:7px;border:1px dashed #ffffffc9;border-radius:18px;z-index:-1;pointer-events:none}.card-no{font-size:10px;letter-spacing:2px;color:#997e94;position:absolute;top:15px;left:15px}.card-art{width:min(100%,156px);height:auto;display:block;overflow:visible;filter:drop-shadow(0 9px 5px #94617c17)}.card-title{font-size:17px;font-weight:800;line-height:1.3}.card-hint{font-size:11px;color:#92768c}.draw-card.winner{border:2px solid #e990a9;box-shadow:0 0 0 4px #fce4eb,0 10px 25px #d782a52e;background:linear-gradient(145deg,#fff7fa,#ffe6ed);animation:pop .45s ease both}.draw-card.miss{opacity:.68}.draw-card.revealed .card-art{animation:pop .4s ease both}.winner .card-hint{color:#bc5d80;font-weight:700}.actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.primary,.secondary{border-radius:100px;font-size:13px;font-weight:750;padding:12px 23px;transition:transform .2s;background:white;border:1px solid #ead6df;color:#94647b}.primary{background:linear-gradient(110deg,#e889a6,#d779a0);border:0;color:white;box-shadow:0 5px 13px #e5a1b68c}.primary:hover,.secondary:hover{transform:translateY(-2px)}.primary:disabled,.secondary:disabled{opacity:.5;cursor:default;transform:none}.result{text-align:center;min-height:26px;margin:17px 0 0;line-height:1.65;color:#91788b;font-size:13px}.result strong{color:#d66b90;font-size:19px}.pool{margin:25px 0 0}.pool-heading{text-align:center;margin-bottom:13px;font-size:12px;letter-spacing:2px;color:#9b7e91;font-weight:800}.pool-items{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pool-item{background:#ffffff9f;border:1px solid #fff;border-radius:19px;display:flex;align-items:center;gap:10px;padding:10px 13px;box-shadow:0 4px 15px #a56c870b;min-width:0}.pool-item svg{width:65px;height:65px;flex-shrink:0}.pool-item b{display:block;font-size:14px;margin-bottom:4px}.pool-item small{display:block;font-size:11px;color:#967d90;line-height:1.4}.foot{text-align:center;font-size:11px;color:#a58b9a;margin-top:24px;letter-spacing:1px}.confetti{position:fixed;pointer-events:none;z-index:10;width:9px;height:13px;border-radius:3px;animation:fall var(--dur) ease-out forwards;left:var(--x);top:-20px;background:var(--c)}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(720deg);opacity:0}}@keyframes pop{0%{transform:scale(.9)}65%{transform:scale(1.04)}100%{transform:scale(1)}}@media(max-width:600px){main{padding:22px 13px 30px}.hero{padding:30px 0 23px}.hero h1{letter-spacing:-1px}.hero p{font-size:13px}.spark{left:1%;top:42px;font-size:20px}.spark.r{right:1%;top:72px;font-size:18px}.stage{padding:17px 11px 20px;border-radius:24px}.stage-top{margin:0 4px 14px}.stage-top h2{font-size:14px}.cards{gap:7px}.draw-card{min-height:175px;border-radius:16px;padding:25px 3px 13px}.draw-card:before{inset:4px;border-radius:12px}.card-no{top:10px;left:10px;font-size:9px}.card-title{font-size:14px}.card-hint{font-size:10px}.pool-items{gap:7px}.pool-item{flex-direction:column;gap:4px;text-align:center;padding:7px 3px 11px;border-radius:15px}.pool-item svg{width:54px;height:54px}.pool-item b{font-size:13px}.pool-item small{font-size:10px}.top{font-size:10px}.tag{padding:7px 9px}.result{font-size:12px}.primary,.secondary{padding:11px 17px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.confetti{display:none}}
</style>
</head><body>
<main>
<header class="top"><div class="brand"><i>♡</i> SWEET LITTLE LUCK</div><div class="tag">今日份快乐 · 3 选 1</div></header>
<section class="hero"><span class="spark" aria-hidden="true">✧</span><span class="spark r" aria-hidden="true">✦</span><div class="eyebrow">A LITTLE TREAT FOR TODAY</div><h1>今天吃点<span>什么？</span></h1><p>把选择交给一点点好运，<br>拆开一份属于今天的小甜蜜。</p></section>
<section class="stage" aria-label="抽奖区域"><div class="stage-top"><h2>挑选你的幸运盲盒</h2><span id="roundLabel">每轮随机洗牌</span></div><div class="cards" id="cards"></div><div class="result" id="result" role="status" aria-live="polite">三份小惊喜，任选一个拆开吧 ♡</div><div class="actions"><button class="primary" id="random">✦ 帮我随机抽一个</button><button class="secondary" id="reset">↻ 重新洗牌</button></div></section>
<section class="pool"><div class="pool-heading">— 今日奖品池 —</div><div class="pool-items" id="pool"></div></section><footer class="foot">不管抽到什么，今天都要开心 ♡</footer>
</main>
<script>
const svg=(body)=>`<svg class="card-art" viewBox="0 0 160 160" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const gift=svg(`<ellipse cx="80" cy="133" rx="51" ry="8" fill="#b77e9c" opacity=".12"/><path d="M34 64h92v59q0 7-7 7H41q-7 0-7-7Z" fill="#f7acc0" stroke="#c97396" stroke-width="2"/><path d="M35 69h90v10H35z" fill="#d7799c" opacity=".25"/><rect x="27" y="51" width="106" height="22" rx="7" fill="#ffccda" stroke="#c97396" stroke-width="2"/><path d="M70 52h20v78H70z" fill="#fff5e2"/><path d="M70 52v78m20-78v78" stroke="#e7b1ae" stroke-width="1.4"/><path d="M80 50C57 54 41 38 48 27c7-11 24 0 32 23Z" fill="#fff2e2" stroke="#c97396" stroke-width="2"/><path d="M80 50c23 4 39-12 32-23-7-11-24 0-32 23Z" fill="#fff2e2" stroke="#c97396" stroke-width="2"/><circle cx="80" cy="49" r="7" fill="#ffe5d3" stroke="#c97396" stroke-width="1.5"/><path d="M59 38l15 9m27-9-15 9" stroke="#df9aab" stroke-width="1.5"/><path d="M44 90v24" stroke="#ffdee7" stroke-width="4"/><path d="M20 36v12m-6-6h12m112 49v12m-6-6h12m-9-72v8m-4-4h8" stroke="#b78ca9" stroke-width="2"/><circle cx="22" cy="108" r="2.5" fill="#c79bb8"/><circle cx="122" cy="17" r="2" fill="#c79bb8"/>`);
const cake=svg(`<ellipse cx="80" cy="131" rx="58" ry="12" fill="#e3a0b2" opacity=".16"/><ellipse cx="80" cy="125" rx="56" ry="11" fill="#fff" stroke="#e4bbc9" stroke-width="2"/><path d="M35 72h90v45c0 11-90 11-90 0z" fill="#f8b9c6" stroke="#c98199" stroke-width="2"/><path d="M35 93c20 12 70 12 90 0v10c-20 12-70 12-90 0z" fill="#fff1ce"/><ellipse cx="80" cy="72" rx="45" ry="13" fill="#fff3e4" stroke="#c98199" stroke-width="2"/><path d="M35 74c7 0 6 15 13 15s7-10 14-10 7 15 15 15 8-14 16-14 8 9 15 9 7-12 17-15" stroke="#fff7e8" stroke-width="8"/><path d="M68 54q-13-14 0-20 7-3 12 4 5-7 12-4 13 6 0 20L80 65z" fill="#e96e87" stroke="#ba5876" stroke-width="1.7"/><path d="M80 38q-3-12 9-16" stroke="#779e78" stroke-width="3"/><path d="M80 34q-9-12-17-5 7 7 17 5Z" fill="#9bc28e"/><path d="M72 43l2 2m12 0 2-2m-9 9 1 2" stroke="#ffe0cf" stroke-width="2"/><path d="M46 110v5" stroke="#ffe8ea" stroke-width="4"/><path d="M22 44v10m-5-5h10m108 0v12m-6-6h12" stroke="#dca0b7" stroke-width="2"/>`);
const tea=svg(`<ellipse cx="80" cy="139" rx="42" ry="8" fill="#c2a0d5" opacity=".18"/><path d="M84 49 102 14" stroke="#a78bc9" stroke-width="10"/><path d="M84 49 102 14" stroke="#d5c1ed" stroke-width="5"/><path d="M38 57h84l-10 70q-1 10-12 10H60q-11 0-12-10z" fill="#f6d2a8" stroke="#b38e91" stroke-width="2"/><path d="M43 76q37-12 74 0l-7 48q-1 10-11 10H61q-10 0-11-10z" fill="#d9b3a3"/><path d="M43 80q37 10 74 0" stroke="#f4dec4" stroke-width="3"/><rect x="33" y="47" width="94" height="15" rx="7.5" fill="#eee4fc" stroke="#a78bc9" stroke-width="2"/><path d="M49 69l6 34" stroke="#fff3de" stroke-width="4"/><g fill="#80606e"><circle cx="62" cy="119" r="7"/><circle cx="78" cy="127" r="6"/><circle cx="94" cy="116" r="7"/><circle cx="105" cy="125" r="5"/><circle cx="79" cy="111" r="5"/></g><path d="M68 91c-8-10 5-17 12-7 7-10 20-3 12 7L80 103Z" fill="#fff2e2" stroke="#bf9294" stroke-width="1.5"/><path d="M20 34v10m-5-5h10m115 43v10m-5-5h10" stroke="#b49bd5" stroke-width="2"/>`);
const snack=svg(`<ellipse cx="80" cy="140" rx="47" ry="7" fill="#d9a57c" opacity=".2"/><g stroke="#d49a53" stroke-width="1.6"><rect x="48" y="30" width="13" height="73" rx="4" transform="rotate(-13 48 30)" fill="#ffd788"/><rect x="61" y="17" width="14" height="85" rx="4" transform="rotate(-4 61 17)" fill="#ffe1a0"/><rect x="82" y="25" width="14" height="79" rx="4" transform="rotate(8 82 25)" fill="#ffce72"/><rect x="101" y="30" width="14" height="73" rx="4" transform="rotate(17 101 30)" fill="#ffe0a1"/><rect x="40" y="48" width="14" height="66" rx="4" transform="rotate(-22 40 48)" fill="#ffca72"/><rect x="111" y="45" width="13" height="66" rx="4" transform="rotate(20 111 45)" fill="#ffcf75"/></g><path d="M38 67q42 22 84 0l-10 59q-2 11-13 11H61q-11 0-13-11Z" fill="#f2a39d" stroke="#c78085" stroke-width="2"/><path d="M38 67q42 22 84 0" stroke="#ffe7d5" stroke-width="4"/><path d="M61 101c-8-12 8-20 19-8 11-12 27-4 19 8l-19 17Z" fill="#fff3dd"/><path d="M57 117v7" stroke="#ffd4c7" stroke-width="3"/><path d="M19 39v10m-5-5h10m118 8v12m-6-6h12" stroke="#dda577" stroke-width="2"/>`);
const prizes=[{name:'蛋糕',art:cake,desc:'甜蜜奶油时刻',message:'今天的幸福，是一口软绵绵的蛋糕。'},{name:'奶茶',art:tea,desc:'快乐吨吨吨',message:'今天的快乐，就从一杯奶茶开始。'},{name:'小吃',art:snack,desc:'香香脆脆的小满足',message:'今天适合吃点香香的小吃，犒劳自己。'}];
let order=[],selected=-1,round=0,lastOrder='';const cards=document.querySelector('#cards'),result=document.querySelector('#result'),randomBtn=document.querySelector('#random'),resetBtn=document.querySelector('#reset');
try{lastOrder=localStorage.getItem('sweet-luck-last-order')||''}catch(e){}
function rand(n){if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}return Math.floor(Math.random()*n)}
function shuffle(){let a;do{a=[0,1,2];for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}}while(a.join(',')===lastOrder);lastOrder=a.join(',');try{localStorage.setItem('sweet-luck-last-order',lastOrder)}catch(e){}return a}
function render(){cards.innerHTML=order.map((p,i)=>{const opened=selected!==-1,winner=i===selected,prize=prizes[p];return `<button type="button" class="draw-card ${opened?'revealed':''} ${winner?'winner':opened?'miss':''}" data-index="${i}" ${opened?'disabled':''} aria-label="${opened?prize.name+(winner?'，中奖':'，未选中'):'选择第'+(i+1)+'个盲盒'}"><span class="card-no">NO. 0${i+1}</span>${opened?prize.art:gift}<span class="card-title">${opened?prize.name:'幸运盲盒'}</span><span class="card-hint">${opened?(winner?'♡ 抽中啦！':'未选中'):'点击拆开'}</span></button>`}).join('');cards.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>draw(Number(b.dataset.index))))}
function reset(){document.querySelectorAll('.confetti').forEach(x=>x.remove());order=shuffle();selected=-1;round++;render();randomBtn.disabled=false;resetBtn.textContent='↻ 重新洗牌';result.textContent='三份小惊喜，任选一个拆开吧 ♡';document.querySelector('#roundLabel').textContent=round===1?'每轮随机洗牌':`第 ${round} 轮 · 已洗牌`}
function draw(i){if(selected!==-1)return;selected=i;let p=prizes[order[i]];render();result.innerHTML=`恭喜抽中 <strong>${p.name}！</strong><br>${p.message}`;randomBtn.disabled=true;resetBtn.textContent='↻ 再抽一次';confetti()}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let colors=['#e78da9','#bca3e1','#f8cf83','#a8cbb6','#f4a99b'];for(let i=0;i<38;i++){let el=document.createElement('i');el.className='confetti';el.style.cssText=`--x:${rand(100)}vw;--dx:${rand(201)-100}px;--dur:${1.4+rand(13)/10}s;--c:${colors[rand(colors.length)]};animation-delay:${rand(25)/100}s`;document.body.append(el);el.addEventListener('animationend',()=>el.remove())}}
randomBtn.addEventListener('click',()=>draw(rand(3)));resetBtn.addEventListener('click',reset);document.querySelector('#pool').innerHTML=prizes.map(p=>`<div class="pool-item">${p.art}<div><b>${p.name}</b><small>${p.desc}</small></div></div>`).join('');reset();
</script></body></html>
